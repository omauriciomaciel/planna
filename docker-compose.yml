services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: planna
      POSTGRES_PASSWORD: planna
      POSTGRES_DB: planna
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://planna:planna@postgres:5432/planna
      SECRET_KEY: dev-secret-key-change-in-prod
      CORS_ORIGINS: '["http://localhost:3000", "http://0.0.0.0:3000"]'
      DEBUG: "true"
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      NUXT_PUBLIC_API_BASE: http://localhost:8000/api
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npx nuxt dev --host 0.0.0.0

volumes:
  pgdata:
