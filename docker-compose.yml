services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: planna
      POSTGRES_USER: planna
      POSTGRES_PASSWORD: planna
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - planna_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planna -d planna"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  planna_postgres:
