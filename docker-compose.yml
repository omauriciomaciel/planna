services:
  backend:
    build:
      context: ./backend
    command:
      - sh
      - -c
      - uv run --frozen --no-dev alembic upgrade head && exec uv run --frozen --no-dev fastapi dev --host 0.0.0.0 --port 8010
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://planna:planna@postgres:5432/planna
      WATCHFILES_FORCE_POLLING: "true"
    ports:
      - "${BACKEND_PORT:-8010}:8010"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8010/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3

  backup:
    image: postgres:17-alpine
    profiles: ["production"]
    command: ["/bin/sh", "/opt/planna/backup.sh"]
    environment:
      PGHOST: postgres
      PGDATABASE: planna
      PGUSER: planna
      PGPASSWORD: planna
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    volumes:
      - ./ops/backup.sh:/opt/planna/backup.sh:ro
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: planna
      POSTGRES_USER: planna
      POSTGRES_PASSWORD: planna
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - planna_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planna -d planna"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  planna_postgres:
